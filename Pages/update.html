<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/style/global.css">
    <link rel="stylesheet" href="/style/order.css">
    <link rel="stylesheet" href="/style/update.css">
    <link rel="stylesheet" href="/style/header.css">
    <title>Update Order</title>
</head>
<body>
    <header>
        <nav class="header-nav">
            <a href="dashboard.html">Dashboard</a>
        </nav>

        <a href="login.html" class="logout">LOGOUT</a>
    </header>

    <main class="order-page">
        <form action="dashboard.html">
            <div class="order-instructions">
                <p>UPDATE ORDER</p>
                <p>Modify the order details below.</p>
            </div>

            <section class="customer">
                <div class="section-title">ORDER ID</div>
                <div class="section-body">
                    <div class="field">
                        <label for="orderId">ORDER ID</label>
                        <input type="text" name="orderId" id="orderId" value="ORD-2205" readonly>
                    </div>
                </div>
            </section>

            <section class="customer">
                <div class="section-title">CUSTOMER DETAILS</div>
                <div class="section-body">
                    <div class="field">
                        <label for="customerName">CUSTOMER NAME</label>
                        <input type="text" name="customerName" id="customerName" value="Bryne Arriola">
                    </div>
                </div>
            </section>

            <section class="payment-status">
                <div class="section-title">PAYMENT STATUS</div>
                <div class="payment-toggle">
                    <input type="radio" name="payment" id="payment-unpaid" class="payment-radio" value="unpaid" checked>
                    <label for="payment-unpaid" class="payment-option unpaid">UNPAID</label>

                    <input type="radio" name="payment" id="payment-paid" class="payment-radio" value="paid">
                    <label for="payment-paid" class="payment-option paid">PAID</label>
                </div>
            </section>

            <section class="select-mode">
                <div class="section-title">SELECT MODE</div>
                <div class="mode-toggle">
                    <input type="radio" name="mode" id="mode-pickup" class="mode-radio" value="pickup">
                    <label for="mode-pickup" class="mode-option">PICKUP</label>

                    <input type="radio" name="mode" id="mode-delivery" class="mode-radio" value="delivery" checked>
                    <label for="mode-delivery" class="mode-option">DELIVERY</label>

                    <input type="radio" name="mode" id="mode-self-service" class="mode-radio" value="self-service">
                    <label for="mode-self-service" class="mode-option">SELF SERVICE</label>
                </div>
            </section>

            <!-- Service Type -->
            <section class="service-type">
                <div class="section-title">SERVICE TYPE</div>

                <div class="service-type-grid">

                    <input type="radio" name="service-type" id="service-wash-fold" class="service-radio" value="wash-fold" checked>
                    <label for="service-wash-fold" class="service-option">
                        <span class="service-name">WASH</span>
                        <span class="service-price">From &#8369; 60 (8KG)</span>
                    </label>

                    <input type="radio" name="service-type" id="service-dry-cleaning" class="service-radio" value="dry-cleaning">
                    <label for="service-dry-cleaning" class="service-option">
                        <span class="service-name">DRY</span>
                        <span class="service-price">&#8369; 60(8KG)</span>
                    </label>

                    <input type="radio" name="service-type" id="service-express-wash" class="service-radio" value="full-service">
                    <label for="service-express-wash" class="service-option">
                        <span class="service-name">FULL SERVICE</span>
                        <span class="service-price">From &#8369; 180</span>
                    </label>

                    <input type="radio" name="service-type" id="service-ironing-only" class="service-radio" value="fold-only">
                    <label for="service-ironing-only" class="service-option">
                        <span class="service-name">FOLD</span>
                        <span class="service-price">From &#8369; 30(8KG)</span>
                    </label>

                </div>
            </section>

            <!-- Details -->
            <section class="service-details">
                <div class="section-title">LOAD DETAILS</div>

                <div class="section-body">
                    <div class="field-row">
                        <div class="field">
                            <label for="weight">ESTIMATED WEIGHT (KG)</label>
                            <div class="input-with-suffix">
                                <input type="number" id="weight" name="weight" step="0.1" min="0" value="3.5">
                                <span class="suffix">kg</span>
                            </div>
                        </div>

                        <div class="field">
                            <label for="items">NUMBER OF ITEMS</label>
                            <input type="number" id="items" name="items" min="0" value="20">
                        </div>
                    </div>

                    <div class="field">
                        <label for="instructions">SPECIAL INSTRUCTIONS</label>
                        <textarea id="instructions" name="instructions" rows="4" placeholder="Use hypoallergenic detergent..."></textarea>
                    </div>
                </div>
            </section>

            <!-- Schedule -->
            <section class="service-schedule">
                <div class="section-title" id="schedule-title">DELIVERY SCHEDULE</div>

                <div class="section-body">
                    <div class="field-row">
                        <div class="field">
                            <label for="pickup-date" id="date-label">DELIVERY DATE</label>
                            <input type="date" id="pickup-date" name="pickup-date" value="2026-08-15">
                        </div>

                        <div class="field">
                            <label for="pickup-time" id="time-label">DELIVERY TIME</label>
                            <select id="pickup-time" name="pickup-time">
                                <option value="8-10">8:00 AM – 10:00 AM</option>
                                <option value="10-12">10:00 AM – 12:00 PM</option>
                                <option value="13-15" selected>1:00 PM – 3:00 PM</option>
                                <option value="15-17">3:00 PM – 5:00 PM</option>
                            </select>
                        </div>
                    </div>

                    <div class="field" id="address-field">
                        <label for="address">DELIVERY ADDRESS</label>
                        <input type="text" id="address" name="address" value="123, Sample St., Brgy. 1, Manila, Metro Manila">
                    </div>
                </div>
            </section>

            <div class="action-row">
                <a href="dashboard.html" class="action-btn btn-cancel">CANCEL</a>
                <button type="button" class="action-btn btn-delete">DELETE</button>
                <button type="submit" class="action-btn btn-update">UPDATE</button>
            </div>

        </form>
    </main>

    <script src="/script/order.js"></script>
</body>
</html>
